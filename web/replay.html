<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HOTFIX! Replay</title>
  <meta name="description" content="Watch a HOTFIX! match play back move by move, rebuilt from the server's event log.">
  <meta name="theme-color" content="#ffd23f">
  <link rel="icon" href="/web/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
  <link rel="stylesheet" href="/web/style.css">
  <script type="module" src="/web/replay.ts"></script>
</head>
<body>
  <main class="wrap">
    <header class="panel replay-head">
      <a class="back" href="/">← Back to the game</a>
      <h1>Replay</h1>
      <p id="about">Loading the match…</p>
      <div class="controls" id="controls" hidden>
        <button type="button" class="pop small" id="toggle">Pause</button>
        <div class="speeds" role="group" aria-label="Playback speed">
          <button type="button" data-speed="1" aria-pressed="false">1x</button>
          <button type="button" data-speed="2" aria-pressed="true">2x</button>
          <button type="button" data-speed="4" aria-pressed="false">4x</button>
          <button type="button" data-speed="8" aria-pressed="false">8x</button>
        </div>
        <input type="range" id="scrub" min="0" max="1" step="100" value="0" aria-label="Replay position">
        <span class="time" id="time">0:00</span>
      </div>
    </header>
    <section class="game" id="stage" hidden>
      <div class="panel arena">
        <div class="head">
          <div class="round" id="round"></div>
          <div class="clock" id="clock">–</div>
        </div>
        <div class="test" id="test" hidden></div>
        <div class="code" id="code" hidden></div>
        <div class="racecode" id="racecode" hidden></div>
        <ol class="ticker" id="ticker"></ol>
      </div>
      <aside class="players" id="players" aria-label="Scores"></aside>
    </section>
  </main>
  <footer class="foot">Nothing here was recorded as video. The page replays the server's event log, the same events that decided every score. <a href="/web/architecture.html">See how it's built</a></footer>
</body>
</html>
